name: local-proof

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    local-proof:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y iverilog verilator

            - name: Python compile
              run: python3 -m compileall -q userspace scripts tests firmware

            - name: Validate
              run: make validate

            - name: Sim AXI-Lite
              run: make sim-axilite

            - name: Sim packer
              run: make sim-packer

            - name: Sim safety
              run: make sim-safety

            - name: Co-sim GKP
              run: make cosim-gkp

            - name: Local release
              run: make release-validate-local
